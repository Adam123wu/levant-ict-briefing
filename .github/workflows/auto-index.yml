name: Auto rebuild index

# 触发条件: issues/ 目录有变化时, 自动重建首页
on:
  push:
    paths:
      - 'issues/**'
      - 'scripts/rebuild_index.py'
      - '.github/workflows/auto-index.yml'
  workflow_dispatch:  # 支持手动触发

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许 bot 提交 index.html
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 需要完整历史, 否则无法 push
          fetch-depth: 0
          # 允许后续 workflow 能被触发
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Rebuild index.html
        run: python scripts/rebuild_index.py
      
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "index.html 无变化, 跳过提交"
          else
            git commit -m "🤖 auto: rebuild index.html"
            git push
            echo "✅ index.html 已更新并推送"
          fi
