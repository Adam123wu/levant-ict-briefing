name: Auto rebuild index

# 触发条件: 任何 w*-*.html 变化时, 自动把最新期复制为 index.html
on:
  push:
    paths:
      - 'w*-*.html'
      - 'scripts/rebuild_index.py'
      - '.github/workflows/auto-index.yml'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Rebuild index.html (copy latest week to index)
        run: python scripts/rebuild_index.py
      
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "index.html unchanged, skip commit"
          else
            git commit -m "auto: update index.html to latest week"
            git push
            echo "index.html updated and pushed"
          fi
