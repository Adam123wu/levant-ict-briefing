name: Refresh Nepal news sources
on:
  schedule:
    - cron: '45 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nepal-sources
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collect_nepal_sources.py
      - name: Save source health and unreviewed candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/sources.json config/nepal-source-candidates.json config/nepal-legal-news.json
          if ! git diff --staged --quiet; then
            git commit -m 'data: refresh Nepal source candidates'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Refresh public source health
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
