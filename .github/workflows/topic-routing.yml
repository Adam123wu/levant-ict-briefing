name: Route social intelligence into topics

on:
  workflow_run:
    workflows: ["Refresh Telegram intelligence"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-topic-routing
  cancel-in-progress: false

jobs:
  route:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest public data
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Route social posts into report topics
        run: python scripts/route_social_topics.py

      - name: Commit topic metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/telegram-feed.json
          if git diff --staged --quiet; then
            echo "No topic-routing changes"
          else
            git commit -m "data: route social intelligence into topics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
