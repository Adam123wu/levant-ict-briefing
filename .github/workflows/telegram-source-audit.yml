name: Audit subscribed Telegram sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram client
        run: python -m pip install --disable-pip-version-check -r requirements-telegram.txt

      - name: Audit subscribed public broadcast channels
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python scripts/audit_subscribed_telegram.py --output /tmp/telegram-source-audit/audit.json

      - name: Upload short-lived audit result
        uses: actions/upload-artifact@v4
        with:
          name: telegram-source-audit
          path: /tmp/telegram-source-audit/audit.json
          retention-days: 1
          if-no-files-found: error
