name: Refresh Telegram intelligence

on:
  schedule:
    # Daily 01:30 Asia/Kathmandu (UTC+5:45).
    - cron: "45 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check verified active-market channels
        id: channels
        run: |
          python - <<'PY'
          import json, os
          sources=json.load(open('config/sources.json'))
          enabled=any(s.get('country')=='尼泊尔' and s.get('platform')=='Telegram' and s.get('identityVerified') and s.get('enabled',True) for s in sources)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('enabled='+str(enabled).lower()+'\n')
          print('Verified Nepal channels configured' if enabled else 'Coverage gap: no verified Nepal Telegram channels; no collection performed')
          PY

      - name: Select collection mode
        if: steps.channels.outputs.enabled == 'true'
        id: mode
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          if test -n "$TG_API_ID" && test -n "$TG_API_HASH" && test -n "$TG_SESSION"; then
            echo "mode=api" >> "$GITHUB_OUTPUT"
            echo "Using Telegram API mode"
          else
            echo "mode=public" >> "$GITHUB_OUTPUT"
            echo "Using credential-free public channel mode"
          fi

      - name: Install Telegram client
        if: steps.mode.outputs.mode == 'api'
        run: python -m pip install --disable-pip-version-check -r requirements-telegram.txt

      - name: Collect via Telegram API
        if: steps.mode.outputs.mode == 'api'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python scripts/collect_telegram.py --days 14

      - name: Collect public Telegram channels without login
        if: steps.mode.outputs.mode == 'public'
        run: python scripts/collect_telegram_public.py --days 14

      - name: Commit public-safe feed
        if: steps.channels.outputs.enabled == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/telegram-feed.json config/sources.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh Telegram intelligence"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy refreshed briefing
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
