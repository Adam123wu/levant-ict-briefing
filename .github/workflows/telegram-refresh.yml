name: Refresh Telegram intelligence

on:
  schedule:
    # Prefetch at Sunday 01:30 Asia/Baghdad so the 02:00 briefing run sees fresh data.
    - cron: "30 22 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-telegram.txt

      - name: Verify required secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          test -n "$TG_API_ID" || { echo "Missing TG_API_ID"; exit 1; }
          test -n "$TG_API_HASH" || { echo "Missing TG_API_HASH"; exit 1; }
          test -n "$TG_SESSION" || { echo "Missing TG_SESSION"; exit 1; }

      - name: Install Telegram client
        run: python -m pip install --disable-pip-version-check -r requirements-telegram.txt

      - name: Collect official Telegram updates
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python scripts/collect_telegram.py --days 14

      - name: Commit public-safe feed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/telegram-feed.json config/sources.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh Telegram intelligence"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy refreshed briefing
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
